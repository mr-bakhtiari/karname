name: karname

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: karname-portal:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      frontend:
        aliases:
          - karname-web

networks:
  frontend:
    external: true
    name: shajare_frontend
